<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaede Photos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --surface2: #1e1e24;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text: #e8e8ec;
      --muted: #6b6b7a;
      --accent: #a78bfa;
      --accent2: #34d399;
      --accent3: #f87171;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --radius: 12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    .section { margin-bottom: 48px; }

    .section-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-count {
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
    }

    .link-list {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--surface);
      text-decoration: none;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .card:last-child { border-bottom: none; }
    .card:hover { background: var(--surface2); }

    .card-name {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
    }

    .card-url {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .card-arrow {
      color: var(--muted);
      font-size: 14px;
      flex-shrink: 0;
      margin-left: 12px;
      transition: color 0.15s, transform 0.15s;
    }

    .card:hover .card-arrow {
      color: var(--text);
      transform: translateX(2px);
    }

    .card.people { border-left: 2px solid rgba(167,139,250,0.5); }
    .card.places { border-left: 2px solid rgba(52,211,153,0.5); }
    .card.others { border-left: 2px solid rgba(248,113,113,0.5); }

    @media (max-width: 600px) {
      .page-wrap { padding: 40px 16px 60px; }
    }
  </style>
</head>
<body>
<div class="page-wrap">

  <section class="section">
    <div class="section-header">
      <span class="section-title">People</span>
      <span class="section-count" id="count-people"></span>
    </div>
    <div class="link-list" id="list-people"></div>
  </section>

  <section class="section">
    <div class="section-header">
      <span class="section-title">Places</span>
      <span class="section-count" id="count-places"></span>
    </div>
    <div class="link-list" id="list-places"></div>
  </section>

  <section class="section">
    <div class="section-header">
      <span class="section-title">Others</span>
      <span class="section-count" id="count-others"></span>
    </div>
    <div class="link-list" id="list-others"></div>
  </section>

</div>

<script>
  // ─────────────────────────────────────────────────────────────
  //  ✏️  EDIT YOUR LINKS HERE
  // ─────────────────────────────────────────────────────────────

  const people = [
    { name: "Lawrence Gaede",   url: "https://photos.app.goo.gl/fLcbEAzxxCkaUb6V9" },
    { name: "Mildred Gaede",    url: "https://photos.app.goo.gl/M29aB7Kv5ARiJ9s96" },
    { name: "Patrick Burke",    url: "https://photos.app.goo.gl/m5w6VDpCVhAW7uX8A" },
    { name: "Larry Gaede",      url: "https://photos.app.goo.gl/U7Foex6LwBezNMCL7" },
    { name: "Marylin Burke",    url: "https://photos.app.goo.gl/JhYMuiGquMoVmWmM7" },
    { name: "Kelly Burke",      url: "https://photos.app.goo.gl/6ys6tD135Fps5uTu8" },
    { name: "Molly Burke",      url: "https://photos.app.goo.gl/5gKC7PJKHGRYF4z2A" },
    { name: "Patrick Burke Jr", url: "https://photos.app.goo.gl/fTfQxh6DMHWYK3eG9" },
  ];

  const places = [
    { name: "Banff",            url: "https://photos.app.goo.gl/4VM3UeGD6HyfbgCQ7" },
    { name: "Cincinnati",       url: "https://photos.app.goo.gl/43jgqzBwy3BcAtgt6" },
    { name: "DC",               url: "https://photos.app.goo.gl/o8ugNJhcWAjNEgJy7" },
    { name: "Europe",           url: "https://photos.app.goo.gl/5XfM9a1yDQ3pqXAd6" },
    { name: "Florida",          url: "https://photos.app.goo.gl/EEycFY7SYAbzhMjGA" },
    { name: "Mexico",           url: "https://photos.app.goo.gl/JXFEm5jkj9p8H7N26" },
    { name: "New Orleans",      url: "https://photos.app.goo.gl/asJGWHcCyRfwpBUe9" },
    { name: "Red River Gorge",  url: "https://photos.app.goo.gl/VAD1edwbr8FenJVFA" },
    { name: "Seattle",          url: "https://photos.app.goo.gl/2Tk1tn2s6CDrz8Mt9" },
    { name: "Yellowstone",      url: "https://photos.app.goo.gl/fa3yzPY1gfWKuPqf8" },
  ];

  const others = [
    { name: "All", url: "https://photos.app.goo.gl/BoSRVu58EiXbhz537" },
  ];

  // ─────────────────────────────────────────────────────────────

  function getDomain(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch { return url; }
  }

  function buildCard(item, category) {
    const a = document.createElement('a');
    a.className = `card ${category}`;
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    const left = document.createElement('div');

    const name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = item.name;

    const urlEl = document.createElement('div');
    urlEl.className = 'card-url';
    urlEl.textContent = getDomain(item.url);

    left.appendChild(name);
    left.appendChild(urlEl);

    const arrow = document.createElement('span');
    arrow.className = 'card-arrow';
    arrow.textContent = '→';

    a.appendChild(left);
    a.appendChild(arrow);
    return a;
  }

  function renderSection(items, listId, countId, category) {
    const list = document.getElementById(listId);
    const countEl = document.getElementById(countId);
    countEl.textContent = `${items.length} links`;
    items.forEach(item => list.appendChild(buildCard(item, category)));
  }

  renderSection(people, 'list-people', 'count-people', 'people');
  renderSection(places, 'list-places', 'count-places', 'places');
  renderSection(others, 'list-others', 'count-others', 'others');
</script>
</body>
</html>
